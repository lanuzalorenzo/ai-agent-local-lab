<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura local: cliente de desarrollo, SSH y servidor con Ollama</title>
  <desc id="descripcion">El equipo cliente usa VS Code con Continue y OpenCode. Ambos consumen la inferencia de Ollama por HTTP en el puerto 11434 y administran el servidor por SSH. Dentro del servidor headless, Ollama sirve el modelo qwen2.5-coder:7b y el puerto queda limitado a la red de laboratorio.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .nodo { fill: #0e2a47; stroke: #38bdf8; stroke-opacity: .55; stroke-width: 1.25; }
    .titulo { fill: #f8fafc; font-size: 12.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .sub { fill: #a3b8c9; font-size: 9.5px; text-anchor: middle; dominant-baseline: central; }
    .etiqueta { fill: #a3b8c9; font-size: 9.5px; text-anchor: middle; dominant-baseline: central; }
    .nota { fill: #a3b8c9; font-size: 9.5px; dominant-baseline: central; }
    .nota-pie { fill: #a3b8c9; font-size: 9.5px; dominant-baseline: central; }
    .edge { stroke: #38bdf8; stroke-opacity: .6; stroke-width: 1.25; fill: none; }
    .frontera { fill: none; stroke: #38bdf8; stroke-opacity: .45; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .frontera-texto { fill: #a3b8c9; font-size: 10px; letter-spacing: .2px; dominant-baseline: central; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8" fill-opacity=".8"/>
    </marker>
  </defs>
  <rect width="880" height="480" rx="16" fill="#07131e"/>
    <rect class="frontera" x="320" y="50" width="530" height="350" rx="14"/>
  <text class="frontera-texto" x="340" y="76">Servidor Ubuntu Server · headless · red de laboratorio</text>
  <rect class="nodo" x="30" y="110" width="220" height="64" rx="12"/>
  <text class="titulo" x="140.0" y="136.0">VS Code + Continue</text>
  <text class="sub" x="140.0" y="154.0">cliente del modelo</text>
  <rect class="nodo" x="30" y="210" width="220" height="64" rx="12"/>
  <text class="titulo" x="140.0" y="236.0">OpenCode</text>
  <text class="sub" x="140.0" y="254.0">CLI</text>
  <rect class="nodo" x="370" y="100" width="270" height="64" rx="12"/>
  <text class="titulo" x="505.0" y="126.0">Ollama · :11434</text>
  <text class="sub" x="505.0" y="144.0">systemd</text>
  <rect class="nodo" x="370" y="200" width="270" height="64" rx="12"/>
  <text class="titulo" x="505.0" y="226.0">qwen2.5-coder:7b</text>
  <text class="sub" x="505.0" y="244.0">modelo operativo</text>
  <rect class="nodo" x="370" y="300" width="150" height="64" rx="12"/>
  <text class="titulo" x="445.0" y="326.0">OpenSSH</text>
  <text class="sub" x="445.0" y="344.0">administración</text>
  <text class="nota" x="690" y="318">Firewall: 11434 solo</text>
  <text class="nota" x="690" y="336">en la red de laboratorio</text>
  <path class="edge" d="M250 142.0L370 128" marker-end="url(#flecha)"/>
  <text class="etiqueta" x="288" y="112">HTTP :11434</text>
  <path class="edge" d="M250 242.0L370 150" marker-end="url(#flecha)"/>
  <path class="edge" d="M250 262L370 332.0" marker-end="url(#flecha)"/>
  <text class="etiqueta" x="300" y="330">SSH</text>
  <path class="edge" d="M505.0 164L505.0 200" marker-end="url(#flecha)"/>
  <text class="etiqueta" x="512" y="182">carga</text>
  <text class="nota-pie" x="30" y="446">El cloud queda fuera: solo con clave en el entorno y datos sintéticos. El eje es local-first.</text>
</svg>
